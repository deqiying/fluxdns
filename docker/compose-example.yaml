# FluxDNS 容器部署示例。
#
# 使用方式：复制为 docker/compose.yaml（或直接 docker compose -f docker/compose-example.yaml 使用），
# 并把 docker/.env.example 复制为 docker/.env 后按需修改。
# 首次启动前，宿主工作目录必须存在且包含 config.yaml（见 docs/implementation/delivery.md）。
name: fluxdns

services:
  fluxdns:
    image: ${FLUXDNS_IMAGE}
    container_name: fluxdns
    restart: unless-stopped
    # SecretRef 的实际值通过 env_file 注入容器环境，不写进镜像与仓库。
    env_file:
      - .env
    ports:
      # DNS 同时需要 UDP 与 TCP。
      - "${FLUXDNS_DNS_PORT:-53}:53/udp"
      - "${FLUXDNS_DNS_PORT:-53}:53/tcp"
      - "${FLUXDNS_DOH_PORT:-443}:443/tcp"
      # Management/WebUI 默认只监听宿主机回环。
      - "${FLUXDNS_WEBUI_BIND:-127.0.0.1}:${FLUXDNS_WEBUI_PORT:-8080}:8080"
    volumes:
      # 整目录挂载：配置、日志、数据库、规则与 TLS 都在这里。
      # 不要改成只挂 config.yaml：Management 的配置提交用同目录原子替换，单文件挂载会失败。
      - ${FLUXDNS_WORK_DIR:-/srv/fluxdns}:/etc/fluxdns
    # root 运行下仍收紧权限：只保留绑定特权端口所需能力。
    # 注意：cap_drop: ALL 会让 root 失去 CAP_DAC_OVERRIDE，宿主工作目录必须归 root 所有。
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # 服务自身的有界停机宽限期是 5s，这里留出余量。
    stop_grace_period: 20s
    # 镜像内没有 shell 工具，使用二进制自身做配置级探针：
    # 它只证明配置可解析、路径合法，不代表 listener 已在服务。
    healthcheck:
      test: ["CMD", "/usr/local/bin/fluxdns", "validate", "--config", "/etc/fluxdns/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
