[package]
name = "fluxdns"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A policy-driven DNS server"
publish = false

[dependencies]
arc-swap = "=1.9.1"
hickory-proto = { version = "=0.26.1", default-features = false, features = ["std"] }
ipnet = "=2.12.1"
reqwest = { version = "=0.13.4", default-features = false, features = [
    "http2",
    "rustls",
    "socks",
] }
socket2 = "=0.6.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_path_to_error = "=0.1.20"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
url = "=2.5.8"
yaml_serde = "=0.10.7"
