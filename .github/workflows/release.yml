name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release-version.outputs.release_version }}
      rust_version: ${{ steps.tool-versions.outputs.rust_version }}
      node_version: ${{ steps.tool-versions.outputs.node_version }}
      pnpm_version: ${{ steps.tool-versions.outputs.pnpm_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main." >&2
            exit 1
          fi

      - name: Read project tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail

          read_tool_version() {
            awk -F '"' -v tool="$1" '$0 ~ "^" tool "[[:space:]]*=" { print $2; exit }' mise.toml
          }

          rust_version="$(read_tool_version rust)"
          node_version="$(read_tool_version node)"
          pnpm_version="$(read_tool_version pnpm)"
          if [[ -z "${rust_version}" || -z "${node_version}" || -z "${pnpm_version}" ]]; then
            echo "Cannot read Rust, Node.js, or pnpm version from mise.toml." >&2
            exit 1
          fi

          echo "rust_version=${rust_version}" >> "${GITHUB_OUTPUT}"
          echo "node_version=${node_version}" >> "${GITHUB_OUTPUT}"
          echo "pnpm_version=${pnpm_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          mapfile -t version_lines < VERSION
          if [[ "${#version_lines[@]}" -ne 1 ]]; then
            echo "VERSION must contain exactly one line." >&2
            exit 1
          fi
          project_version="${version_lines[0]%$'\r'}"
          if [[ ! "${project_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain exactly one valid SemVer version." >&2
            exit 1
          fi
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must contain a valid SemVer version after the v prefix." >&2
            exit 1
          fi

          cargo_version="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version[[:space:]]*=/ { gsub(/["[:space:]]/, "", $3); print $3; exit }
          ' backend/Cargo.toml)"
          frontend_version="$(awk -F '"' '/^[[:space:]]*"version"[[:space:]]*:/ { print $4; exit }' frontend/package.json)"

          if [[ "${tag_version}" != "${project_version}" ]]; then
            echo "Tag version ${tag_version} does not match VERSION ${project_version}." >&2
            exit 1
          fi
          if [[ "${cargo_version}" != "${project_version}" ]]; then
            echo "Backend package version ${cargo_version} does not match VERSION ${project_version}." >&2
            exit 1
          fi
          if [[ "${frontend_version}" != "${project_version}" ]]; then
            echo "Frontend package version ${frontend_version} does not match VERSION ${project_version}." >&2
            exit 1
          fi

          echo "release_version=${project_version}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Test and build WebUI
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.prepare.outputs.pnpm_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.prepare.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check and build frontend
        working-directory: frontend
        run: |
          pnpm run test
          pnpm run build

      - name: Upload tested WebUI
        uses: actions/upload-artifact@v6
        with:
          name: webui-dist
          path: frontend/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  rust-quality:
    name: Check Rust backend
    # --all-features 会启用 webui-embed，必须先取得本次构建的真实 WebUI。
    needs: [prepare, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.prepare.outputs.rust_version }}
          components: clippy, rustfmt
          cache: false
          rustflags: ""

      - name: Cache Rust target artifacts
        uses: actions/cache@v4
        with:
          path: backend/target
          key: rust-target-${{ runner.os }}-quality-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            rust-target-${{ runner.os }}-quality-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Download tested WebUI
        uses: actions/download-artifact@v7
        with:
          name: webui-dist
          path: frontend/dist

      - name: Run Rust static checks
        run: cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path backend/Cargo.toml --locked --all-features

  create-release:
    name: Create draft GitHub Release
    needs: [prepare, frontend, rust-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "Release ${GITHUB_REF_NAME} already exists and is published." >&2
              exit 1
            fi
            echo "Draft release ${GITHUB_REF_NAME} already exists; reusing it."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.id }}
    needs: [prepare, frontend, rust-quality, create-release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 四个平台仅依赖共享门禁，彼此之间没有构建依赖。
      max-parallel: 4
      matrix:
        include:
          - id: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            source_name: fluxdns.exe
            platform_name: windows
            architecture_name: x86_64
            archive_extension: zip
          - id: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            source_name: fluxdns
            platform_name: linux
            architecture_name: x86_64
            archive_extension: tar.gz
          - id: openwrt-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            source_name: fluxdns
            platform_name: openwrt
            architecture_name: x86_64
            archive_extension: tar.gz
          - id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            source_name: fluxdns
            platform_name: macos
            architecture_name: arm64
            archive_extension: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenWrt musl build tools
        if: matrix.id == 'openwrt-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          # 预装的 Chrome 源可能在镜像同步期间返回 Hash Sum mismatch，构建不依赖它。
          sudo rm -f \
            /etc/apt/sources.list.d/*google* \
            /etc/apt/sources.list.d/*chrome*
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          sudo apt-get install --yes --no-install-recommends musl-tools binutils
          # SQLite 和 ring 的 C 代码及最终链接均使用 musl 工具链。
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "${GITHUB_ENV}"

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.prepare.outputs.rust_version }}
          target: ${{ matrix.target }}
          cache: false
          rustflags: ${{ matrix.id == 'openwrt-x86_64' && '-C target-feature=+crt-static' || '' }}

      - name: Cache Rust target artifacts
        uses: actions/cache@v4
        with:
          path: backend/target
          key: rust-target-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ matrix.id }}-

      - name: Download tested WebUI
        uses: actions/download-artifact@v7
        with:
          name: webui-dist
          path: frontend/dist

      - name: Build embedded release binary
        run: cargo build --manifest-path backend/Cargo.toml --locked --release --features webui-embed --target ${{ matrix.target }}

      - name: Verify OpenWrt static linkage
        if: matrix.id == 'openwrt-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          binary="backend/target/x86_64-unknown-linux-musl/release/fluxdns"
          headers="${RUNNER_TEMP}/fluxdns-openwrt-program-headers.txt"
          dynamic="${RUNNER_TEMP}/fluxdns-openwrt-dynamic.txt"
          readelf --program-headers --wide "${binary}" > "${headers}"
          readelf --dynamic --wide "${binary}" > "${dynamic}"
          # 能在 Ubuntu 执行不代表能在 OpenWrt 执行，必须拒绝动态加载依赖。
          if grep -q 'INTERP' "${headers}" || grep -Fq '(NEEDED)' "${dynamic}"; then
            echo "OpenWrt binary must not require an ELF interpreter or shared libraries." >&2
            cat "${headers}" "${dynamic}" >&2
            exit 1
          fi

      - name: Package and verify release binary
        id: package
        shell: pwsh
        env:
          ARCHITECTURE_NAME: ${{ matrix.architecture_name }}
          ARCHIVE_EXTENSION: ${{ matrix.archive_extension }}
          PLATFORM_NAME: ${{ matrix.platform_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          SOURCE_NAME: ${{ matrix.source_name }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          $source = Join-Path "backend/target/$env:TARGET_TRIPLE/release" $env:SOURCE_NAME
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Release binary does not exist: $source"
          }

          $archiveBase = "fluxdns_$($env:RELEASE_VERSION)_$($env:PLATFORM_NAME)_$($env:ARCHITECTURE_NAME)"
          $packageDirectory = Join-Path $env:RUNNER_TEMP "fluxdns-package/$archiveBase"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path deploy -Force | Out-Null
          $destination = Join-Path $packageDirectory $env:SOURCE_NAME
          Copy-Item -LiteralPath $source -Destination $destination -Force
          Copy-Item -LiteralPath README.md -Destination $packageDirectory
          Copy-Item -LiteralPath config-example.yaml -Destination $packageDirectory
          if (Test-Path -LiteralPath LICENSE -PathType Leaf) {
              Copy-Item -LiteralPath LICENSE -Destination $packageDirectory
          }

          if (-not $IsWindows) {
              & chmod +x $destination
              if ($LASTEXITCODE -ne 0) {
                  throw "chmod failed with exit code $LASTEXITCODE"
              }
          }

          $actualVersion = (& (Resolve-Path -LiteralPath $destination) --version | Out-String).Trim()
          $expectedVersion = "fluxdns $env:RELEASE_VERSION"
          if ($actualVersion -ne $expectedVersion) {
              throw "Expected '$expectedVersion', got '$actualVersion'."
          }

          $assetPath = Join-Path "deploy" "$archiveBase.$env:ARCHIVE_EXTENSION"
          if ($env:ARCHIVE_EXTENSION -eq "zip") {
              Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $assetPath -CompressionLevel Optimal
          }
          else {
              & tar -C $packageDirectory -czf $assetPath .
              if ($LASTEXITCODE -ne 0) {
                  throw "tar failed with exit code $LASTEXITCODE"
              }
          }
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Release archive does not exist: $assetPath"
          }
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Upload release asset
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        shell: pwsh
        run: |
          gh release upload $env:GITHUB_REF_NAME $env:ASSET_PATH --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset."
          }

  finalize-release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download uploaded release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "fluxdns_${{ needs.prepare.outputs.release_version }}_*" \
            --dir deploy
          mapfile -t assets < <(find deploy -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \))
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected four platform archives, found ${#assets[@]}." >&2
            exit 1
          fi
          (cd deploy && sha256sum fluxdns_*.zip fluxdns_*.tar.gz > checksums.txt)

      - name: Upload checksums and publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" deploy/checksums.txt --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
