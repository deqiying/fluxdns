<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">FluxDNS 单次 DNS 查询当前流程与目标流程对比</title>
  <desc id="desc">上半部分展示当前查询主线包含完整策略匹配、同步内存缓存提交、同步统计与解析日志生产；下半部分展示目标流程的安全快速缓存命中、统一解析事件和异步缓存、统计与详情消费者。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-async" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font: 700 30px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 23px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #111827; }
      .section-note { font: 400 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .box-title { font: 700 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; text-anchor: middle; }
      .box-text { font: 400 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .label { font: 600 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label-green { font: 700 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #15803d; }
      .label-amber { font: 700 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .foot { font: 400 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.7; rx: 6; }
      .box-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.7; rx: 6; }
      .box-red { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.7; rx: 6; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.7; rx: 6; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .hit { fill: none; stroke: #16a34a; stroke-width: 2.2; marker-end: url(#arrow); }
      .async { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow-async); }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="#ffffff"/>
  <text class="title" x="48" y="50">FluxDNS 单次 DNS 查询流程：当前实现与目标架构</text>
  <text class="subtitle" x="48" y="78">目标：warm memory cache hit 的服务端处理延迟 P99 不超过 2ms，并把观测与 cache commit 移出请求任务</text>

  <rect class="panel" x="32" y="105" width="1536" height="345"/>
  <text class="section" x="55" y="143">当前实现</text>
  <text class="section-note" x="180" y="143">完整 Policy 决策先于 cache lookup；红色节点仍在客户端响应主线上</text>

  <rect class="box" x="55" y="190" width="145" height="76"/>
  <text class="box-title" x="127" y="220">Transport adapter</text>
  <text class="box-text" x="127" y="244">wire decode</text>

  <rect class="box-blue" x="238" y="190" width="145" height="76"/>
  <text class="box-title" x="310" y="220">dispatch_inbound</text>
  <text class="box-text" x="310" y="244">统一 DnsCore</text>

  <rect class="box" x="421" y="190" width="145" height="76"/>
  <text class="box-title" x="493" y="213">PolicyIndex</text>
  <text class="box-text" x="493" y="237">route/client/rules</text>
  <text class="box-text" x="493" y="255">hosts/ECS/target</text>

  <rect class="box-green" x="604" y="190" width="145" height="76"/>
  <text class="box-title" x="676" y="220">Cache lookup</text>
  <text class="box-text" x="676" y="244">key v1</text>

  <rect class="box" x="787" y="190" width="145" height="76"/>
  <text class="box-title" x="859" y="220">Upstream</text>
  <text class="box-text" x="859" y="244">miss 时查询</text>

  <rect class="box-red" x="970" y="190" width="145" height="76"/>
  <text class="box-title" x="1042" y="213">同步 cache commit</text>
  <text class="box-text" x="1042" y="237">admission / CAS</text>
  <text class="box-text" x="1042" y="255">follower completion</text>

  <rect class="box" x="1153" y="190" width="145" height="76"/>
  <text class="box-title" x="1225" y="220">结果归一化</text>
  <text class="box-text" x="1225" y="244">TTL / terminal</text>

  <rect class="box-red" x="1336" y="190" width="177" height="76"/>
  <text class="box-title" x="1424" y="213">同步观测收尾</text>
  <text class="box-text" x="1424" y="237">stats locks / HashMap</text>
  <text class="box-text" x="1424" y="255">answers / JSON / queue lock</text>

  <path class="flow" d="M 200 228 H 230"/>
  <path class="flow" d="M 383 228 H 413"/>
  <path class="flow" d="M 566 228 H 596"/>
  <path class="flow" d="M 749 228 H 779"/>
  <path class="flow" d="M 932 228 H 962"/>
  <path class="flow" d="M 1115 228 H 1145"/>
  <path class="flow" d="M 1298 228 H 1328"/>
  <path class="hit" d="M 676 190 V 168 H 1225 V 182"/>
  <text class="label-green" x="907" y="160">hit：跳过 upstream 与写入，但不跳过同步观测</text>

  <rect class="box-blue" x="1336" y="326" width="177" height="72"/>
  <text class="box-title" x="1424" y="355">ResponseHandle</text>
  <text class="box-text" x="1424" y="379">encode + send/write</text>
  <path class="flow" d="M 1424 266 V 318"/>
  <text class="label" x="55" y="420">Cache persistence 已经是 bounded 后台写入；当前同步成本主要是内存提交、single-flight 完成、统计聚合与 resolve_log payload 生产。</text>

  <rect class="panel" x="32" y="480" width="1536" height="650"/>
  <text class="section" x="55" y="518">目标架构</text>
  <text class="section-note" x="180" y="518">绿色为可证明安全的 cache fast path；虚线为有界、无等待的异步移交</text>

  <rect class="box" x="55" y="570" width="155" height="76"/>
  <text class="box-title" x="132" y="600">Transport adapter</text>
  <text class="box-text" x="132" y="624">wire decode</text>

  <rect class="box-blue" x="250" y="570" width="155" height="76"/>
  <text class="box-title" x="327" y="600">dispatch_inbound</text>
  <text class="box-text" x="327" y="624">revision + admission</text>

  <rect class="box" x="445" y="570" width="175" height="76"/>
  <text class="box-title" x="532" y="593">PolicyContext</text>
  <text class="box-text" x="532" y="617">route/client/strategy</text>
  <text class="box-text" x="532" y="635">namespace/fingerprint</text>

  <rect class="box-green" x="660" y="570" width="165" height="76"/>
  <text class="box-title" x="742" y="600">Fast cache lookup</text>
  <text class="box-text" x="742" y="624">key v2 + eligibility</text>

  <rect class="box-green" x="1040" y="570" width="165" height="76"/>
  <text class="box-title" x="1122" y="600">结果归一化</text>
  <text class="box-text" x="1122" y="624">共享 client response</text>

  <rect class="box-amber" x="1245" y="570" width="165" height="76"/>
  <text class="box-title" x="1327" y="593">try_publish</text>
  <text class="box-text" x="1327" y="617">ResolutionEnvelope</text>
  <text class="box-text" x="1327" y="635">无 await / 无 I/O</text>

  <rect class="box-blue" x="1450" y="570" width="95" height="76"/>
  <text class="box-title" x="1497" y="600">响应</text>
  <text class="box-text" x="1497" y="624">encode/send</text>

  <path class="flow" d="M 210 608 H 242"/>
  <path class="flow" d="M 405 608 H 437"/>
  <path class="flow" d="M 620 608 H 652"/>
  <path class="hit" d="M 825 608 H 1032"/>
  <text class="label-green" x="895" y="595">hit</text>
  <path class="flow" d="M 1205 608 H 1237"/>
  <path class="flow" d="M 1410 608 H 1442"/>

  <rect class="box" x="660" y="735" width="165" height="82"/>
  <text class="box-title" x="742" y="760">完整 RouteDecision</text>
  <text class="box-text" x="742" y="784">listener hosts / rules</text>
  <text class="box-text" x="742" y="802">final target / ECS</text>

  <rect class="box" x="875" y="735" width="165" height="82"/>
  <text class="box-title" x="957" y="770">Upstream</text>
  <text class="box-text" x="957" y="794">miss / ineligible</text>

  <path class="flow" d="M 742 646 V 727"/>
  <text class="label" x="753" y="692">miss / ineligible</text>
  <path class="flow" d="M 825 776 H 867"/>
  <path class="flow" d="M 1040 776 H 1122 V 654"/>
  <text class="label" x="1060" y="762">origin response</text>

  <rect class="box-amber" x="1215" y="735" width="225" height="72"/>
  <text class="box-title" x="1327" y="764">ResolutionDispatcher</text>
  <text class="box-text" x="1327" y="788">move candidate + Arc event</text>
  <path class="async" d="M 1327 646 V 727"/>
  <text class="label-amber" x="1340" y="692">bounded async</text>

  <rect class="box-amber" x="800" y="890" width="215" height="100"/>
  <text class="box-title" x="907" y="916">CacheCommitWorker</text>
  <text class="box-text" x="907" y="940">admission / memory CAS</text>
  <text class="box-text" x="907" y="958">follower completion</text>
  <text class="box-text" x="907" y="976">persistence enqueue</text>

  <rect class="box-blue" x="1115" y="890" width="190" height="90"/>
  <text class="box-title" x="1210" y="925">Stats consumer</text>
  <text class="box-text" x="1210" y="949">dimensions / accumulator</text>

  <rect class="box" x="1400" y="890" width="145" height="90"/>
  <text class="box-title" x="1472" y="916">Detail worker</text>
  <text class="box-text" x="1472" y="940">redaction / JSON</text>
  <text class="box-text" x="1472" y="958">resolve_log</text>

  <path class="async" d="M 1268 807 V 850 H 907 V 882"/>
  <path class="async" d="M 1327 807 V 850 H 1210 V 882"/>
  <path class="async" d="M 1386 807 V 850 H 1472 V 882"/>

  <rect class="box" x="800" y="1030" width="215" height="62"/>
  <text class="box-title" x="907" y="1056">Memory cache + persistence</text>
  <text class="box-text" x="907" y="1078">commit outcome 独立观测</text>
  <path class="async" d="M 907 990 V 1022"/>

  <rect class="box" x="1400" y="1030" width="145" height="62"/>
  <text class="box-title" x="1472" y="1056">SQLite batch</text>
  <text class="box-text" x="1472" y="1078">best effort</text>
  <path class="async" d="M 1472 980 V 1022"/>

  <text class="label" x="55" y="1100">关键语义：cache hit 无写入；async commit 优化 miss 路径。队列满时 DNS 继续响应，事件 gap 可观测，armed lease 必须释放 follower。</text>

  <rect x="32" y="1155" width="1536" height="54" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <line x1="55" y1="1182" x2="105" y2="1182" class="flow"/>
  <text class="foot" x="118" y="1187">同步主线</text>
  <line x1="250" y1="1182" x2="300" y2="1182" class="async"/>
  <text class="foot" x="313" y="1187">bounded async</text>
  <rect class="box-green" x="495" y="1167" width="44" height="28"/>
  <text class="foot" x="552" y="1187">安全 cache fast path</text>
  <rect class="box-red" x="760" y="1167" width="44" height="28"/>
  <text class="foot" x="817" y="1187">当前请求主线上的可移除成本</text>
  <text class="foot" x="1175" y="1187">目标 SLO：warm cache hit P99 ≤ 2ms</text>
</svg>
