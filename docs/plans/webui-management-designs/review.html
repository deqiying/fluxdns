<style>
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body { margin: 0; color: #202124; background: #FFFFFF; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; letter-spacing: 0; }
a { color: #066BCC; text-decoration: none; }
a:focus-visible { outline: 3px solid #007AFF; outline-offset: 4px; }
header { position: sticky; top: 0; z-index: 2; min-height: 72px; padding: 16px 28px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; background: #FFFFFF; border-bottom: 1px solid #E8E9EC; }
h1 { margin: 0; font-size: 24px; font-weight: 650; }
header p { margin: 0; color: #63666D; }
header .status { font-size: 12px; margin-left: auto; padding: 4px 9px; border-radius: 5px; background: #FBF3E5; color: #9E6A17; }
.layout { display: grid; grid-template-columns: 208px minmax(0, 1fr); }
nav { position: sticky; top: 73px; align-self: start; max-height: calc(100dvh - 74px); overflow-y: auto; padding: 24px 16px; background: #F5F5F7; border-right: 1px solid #E8E9EC; min-height: calc(100dvh - 74px); }
nav a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 10px; color: #45484F; border-radius: 5px; overflow-wrap: anywhere; }
nav a:hover { background: #DEEBFD; color: #066BCC; }
nav span { color: #8B8F98; font-variant-numeric: tabular-nums; }
main { min-width: 0; padding: 4px 28px 48px; }
section { padding: 28px 0 24px; border-bottom: 1px solid #E8E9EC; }
h2 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
figure { margin: 0; min-width: 0; }
figure a { display: block; }
img { display: block; width: 100%; height: auto; aspect-ratio: 20 / 13; border: 1px solid #E0E2E6; border-radius: 6px; background: #F5F5F7; }
figure a:hover img { border-color: #007AFF; }
figcaption { display: flex; gap: 12px; justify-content: space-between; margin-top: 10px; color: #45484F; font-size: 13px; }
figcaption span { color: #8B8F98; white-space: nowrap; font-size: 12px; }
footer { margin-top: 30px; display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; }
@media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 660px) {
 html { scroll-padding-top: 100px; }
 header { padding: 12px 16px; gap: 8px 16px; }
 header p { font-size: 12px; }
 .layout { display: block; }
 nav { position: static; min-height: 0; max-height: none; padding: 10px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #E8E9EC; border-right: 0; }
 nav a { font-size: 12px; padding: 7px 6px; }
 main { padding: 0 16px 32px; }
 section { padding-top: 24px; }
 h2 { font-size: 18px; }
 figcaption { flex-wrap: wrap; }
}
@media print {
 header, nav, footer { display: none; }
 .layout { display: block; }
 main { padding: 0; }
 section { break-before: page; border: 0; }
 .grid { display: block; }
 figure { break-inside: avoid; margin-bottom: 20px; }
}
</style>
