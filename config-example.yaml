# FluxDNS v1 配置模板
#
# 该文件描述当前 version: 1 的配置契约。
# 目标是先收敛配置契约，再进入运行时实现：
# 1. 修正示例格式、路径和引用歧义；
# 2. 增加版本、默认值和严格校验约定；
# 3. 用可表达继承/禁用的策略字段替代布尔组合；
# 4. 用 SecretRef 管理代理凭据，并用地址数组表达双栈监听。
#
# 未在本文件中加入 DoT、DoQ、上游健康检查、热加载和远程版本锁定字段；这些能力待后续契约单独定稿。

# 配置 schema 版本；字段重命名和迁移以此版本为边界。
version: 1

# work.path 是独立的工作目录配置；绝对路径直接使用，相对路径以启动配置文件所在目录为基准。
# 启动时如果配置文件所在目录不是解析后的 work.path，程序将其复制到 <work.path>/config.yaml；
# 该副本是工作目录中的配置快照，固定命名为 config.yaml。
work:
  # 工作目录；规则、数据、日志和缓存等相对路径都以此目录为基准。
  path: /etc/fluxdns # 示例路径；部署时替换为实际绝对路径。
  # 规则资源的落盘目录，相对于 work.path。
  rules_path: ./rules

# 数据库配置。聚合统计默认开启，因此 database 始终必填；resolve_log 详情和聚合统计共用此数据库。
database:
  # 数据库后端；当前仅支持 sqlite。
  type: sqlite
  # SQLite 数据库文件路径，相对于 work.path，父目录由程序创建。
  path: ./data/fluxdns.sqlite3

# 服务日志配置。
logs:
  # 是否启用服务日志。
  enable: true
  # 日志级别；未知值必须在启动时拒绝。
  level: info
  # 日志文件路径，相对于 work.path。
  path: ./logs/fluxdns.log

# Web 管理界面预留配置。v1 仅保留 schema，不启动 WebUI、管理 API 或认证服务。
webui:
  # v1 必须为 false；设为 true 时以“不支持的功能”拒绝启动，不能静默忽略。
  enable: false
  # 以下字段作为后续版本的设计预留，v1 仍进行类型和安全校验，但不参与绑定。
  address: 127.0.0.1
  port: 8080
  # 保留登录用户结构，便于后续版本兼容；真实 hash 不应提交到公开仓库。
  users:
    # 用户名必须唯一。
    - name: example-admin
      # 初始化流程接收一次明文密码并只将单向 hash 写入此字段；运行时仅执行 verify。
      # 这里只是不可作为默认凭据的格式 fixture，后续启用 WebUI 前必须替换。
      password_hash: "$2a$10$jkBqXYJuD.4MlWKNMGF7yOao.t5povZHMghW/IvFtU6aCVTak05sS"

# DNS 全局配置。
dns:
  # DNS 全局默认配置。
  # DNS 缓存配置；TTL 覆写位于同级的 ttl_override。
  cache:
    # 是否启用全局缓存池；策略或客户端可选择更具体的逻辑缓存池。
    enabled: true
    # 三类逻辑缓存池共享同一个内存容量预算，不会按策略或客户端重复分配该上限。
    memory:
      # 内存缓存的计费容量上限，单位为字节；不是进程 RSS 的硬上限。
      max_size_bytes: 67108864
    # 无自然可用 TTL 的短期响应使用该 TTL，例如 SERVFAIL 和上游 TC=1 响应。
    # v1 要求 1s <= failure_ttl <= 5m。
    failure_ttl: 5s
    # 过期记录是否允许先返回并异步刷新。
    optimistic:
      # 是否允许返回已过期记录并在后台刷新。
      enabled: true
      # 乐观缓存应答使用的 TTL。
      answer_ttl: 10s
      # 记录过期后仍可乐观返回的最长时间。
      max_age: 1d
    # 缓存持久化设置；策略级和客户端级 cache 不包含此部分。
    persistence:
      # 持久化缓存文件路径，相对于 work.path。
      path: ./cache.db
      # 持久化缓存文件的最大大小，单位为字节。
      max_size_bytes: 8388608

  # TTL 覆写与 cache 平级；用于控制返回给客户端的 DNS TTL。
  # 未配置的字段继承下层，enabled=false 表示在当前层级关闭 TTL 覆写。
  ttl_override:
    # 是否启用 TTL 覆写。
    enabled: false
    # 最小 TTL；0s 表示不设置下限。
    min: 0s
    # 最大 TTL；0s 表示不设置上限。
    max: 0s

  # ECS（EDNS Client Subnet）全局默认配置。
  # mode: disabled | client | custom
  # 未配置更高层级时，按 global → upstream → client → strategy → rule 的顺序继承。
  # mode: client 使用请求携带的 ECS；请求没有 ECS 时按客户端地址推导前缀。
  # mode: disabled 会停止继续向上游传递 ECS；mode: custom 时 custom_ip 必填。
  edns_client_subnet:
    # ECS 处理模式。
    mode: client

  # 解析详情日志配置；聚合统计默认开启，即使这里关闭也需要可用的 database。
  resolve_log:
    # 是否记录每次解析请求的详情；false 不会关闭按日/客户端等聚合统计。
    enable: true
    # 详细记录达到该软阈值后启动异步淘汰。
    eviction_threshold_records: 90000
    # 详细记录的硬上限；达到上限且无法及时淘汰时丢弃新的详细记录，但继续累计统计。
    max_records: 100000
    # 记录最长保留时间。
    max_record_age: 7d

# 一个 listener 是一个逻辑服务；addresses 中的地址由运行时展开为独立 socket。
# 同一个 listener 的所有地址共享 type、port 和 strategy。
# 同时列出 0.0.0.0 与 :: 时，实现应明确 IPv6 socket 的 v6-only 行为，避免地址重叠。
# 请求入口列表；每个条目代表一个逻辑服务。
listener:
  - name: dns-udp
    # listener 的逻辑名称，必须唯一。
    # 传输协议；当前支持 udp、tcp 和 doh。
    type: udp
    # 一个逻辑 listener 可绑定多个 IPv4/IPv6 地址。
    addresses:
      - 0.0.0.0
      - "::"
    # 所有 addresses 共用的监听端口。
    port: 53
    # 默认解析策略。
    strategy: default

  - name: dns-tcp
    type: tcp
    addresses:
      - 0.0.0.0
      - "::"
    port: 53
    # 入口级本地 hosts 资源；未命中时继续使用 strategy。
    hosts: host1
    strategy: default

  # 一个逻辑 DoH listener 通过 routes 共享策略；endpoints 定义它可以同时拥有的绑定端点。
  # 同一个 DoH listener 可以同时包含 FluxDNS 自终止 TLS 的公网端点，以及 Nginx 反代端点。
  # tls.mode 和 client_ip.source 只作用于各自 endpoint，不是整个 DoH listener 的二选一开关。
  # /dns-quer/inner* 和 /dns-quer/outside* 由服务保留，不能配置为自定义路径。
  #
  # endpoint.tls.mode:
  # - terminate：FluxDNS 自己完成 TLS 握手和解密，certificate_file/private_key_file 必填；
  # - external：该 endpoint 接收已经由 Nginx 等反向代理终止 TLS 的 HTTP 请求，证书字段禁止出现。
  #
  # endpoint.client_ip.source:
  # - peer：使用 TCP 对端地址（直连模式）；
  # - forwarded_header：仅从 trusted_proxies 发来的指定 HTTP header 读取客户端 IP；
  # - proxy_protocol：从 PROXY protocol 读取客户端 IP，也必须限制 trusted_proxies；
  #   v1 自动识别并支持 PROXY v1/v2，未知版本或缺失/非法前导头直接拒绝。
  # forwarded_header 的 header 可选 X-Forwarded-For、X-Real-IP 或 Forwarded；
  # on_missing/on_invalid 可选 reject 或 use_peer，生产配置建议使用 reject。
  - name: doh
    type: doh
    # 每条 DoH 路由固定同时支持 GET 和 POST；不提供按路由关闭某一方法的配置。
    # POST 使用 application/dns-message 原始 wire body，GET 使用无填充 base64url 的 dns 参数。
    # 解码后的 DNS wire 与 POST body 上限固定为 65535 字节。
    # DoH 路由列表；所有 endpoint 共用这些路径和策略。
    routes:
      # HTTP 请求路径；允许使用 {client_id} 占位符。
      - path: /dns/inner/{client_id}
        strategy: inner
      - path: /dns/outside/{client_id}
        strategy: outside
    # 同一个逻辑 DoH 入口可以同时拥有直连和反代端点。
    endpoints:
      # 公网直连：FluxDNS 自己终止 TLS。
      - name: direct
        # 该 endpoint 的绑定地址列表。
        addresses:
          - 0.0.0.0
          - "::"
        # 该 endpoint 的本地监听端口。
        port: 443
        # TLS 所有权和证书材料。
        tls:
          # terminate 表示由 FluxDNS 自己完成 TLS 握手。
          mode: terminate
          # 证书链文件路径，相对于 work.path。
          certificate_file: ./tls/fullchain.pem
          # 私钥文件路径，相对于 work.path。
          private_key_file: ./tls/privkey.pem
        # 请求客户端 IP 的来源。
        client_ip:
          # peer 表示使用 TCP 对端地址。
          source: peer

      # Nginx 反代：Nginx 在公网端口终止 TLS，再转发到此内部 HTTP 端点。
      - name: nginx
        addresses:
          - 127.0.0.1
          - "::1"
        # 使用独立于 WebUI 的内部端口，避免与 webui.address/webui.port 绑定冲突。
        port: 8053
        # external 表示 TLS 已由 Nginx 终止，FluxDNS 接收内部 HTTP。
        tls:
          mode: external
        # 反代场景下恢复真实客户端 IP。
        client_ip:
          source: forwarded_header
          # 反代设置的客户端 IP header 名称。
          header: X-Forwarded-For
          # 这里填写 Nginx 的对端地址或网段，而不是最终客户端网段。
          trusted_proxies:
            - 127.0.0.1/32
            - "::1/128"
          # 缺少 header 时的处理方式。
          on_missing: reject
          # header 格式非法时的处理方式。
          on_invalid: reject

# DNS 上游配置。
upstreams:
  # 上游资源列表；可被 strategy、bootstrap 和 group 引用。
  # 每个上游的 name 必须唯一。
  - name: host
    # 上游类型；当前示例为 hosts、doh 和 group。
    type: hosts
    # 内联内容格式。
    format: json
    # 内联 hosts 数据；按 format 进行严格解析。
    hosts: |-
      {
        "*.aio.com": {
          "A": "192.168.1.1",
          "AAAA": ["fd00::1"]
        },
        "dns.alidns.com": {
          "A": ["223.5.5.5", "223.6.6.6"]
        },
        "abc.com": {
          "CNAME": "c.abc.com"
        }
      }

  - name: aliyun
    # DoH 上游地址。
    type: doh
    # DoH 服务 URL。
    address: https://dns.alidns.com/dns-query
    # 引导解析该 URL 主机名时使用的上游名称；与 connect_ip 互斥。
    bootstrap: host
    # 上游级 ECS 覆盖；未配置时继承全局设置。
    edns_client_subnet:
      # ECS 处理模式。
      mode: custom
      # mode=custom 时使用的 ECS 网段。
      custom_ip: 120.85.32.0/24

  - name: tencent
    type: doh
    # DoH 服务 URL。
    address: https://doh.pub/dns-query
    # 引导解析上游名称。
    bootstrap: aliyun
    edns_client_subnet:
      mode: custom
      custom_ip: 120.85.32.0/24

  - name: cloudflare
    type: doh
    # DoH 服务 URL。
    address: https://cloudflare-dns.com/dns-query
    # 引导解析上游名称。
    bootstrap: aliyun

  - name: google
    type: doh
    # DoH 服务 URL。
    address: https://dns.google/dns-query
    # connect_ip 仅表示连接目标 IP，不表示 HTTP Host 或 TLS SNI；与 bootstrap 互斥。
    connect_ip: 8.8.8.8
    # 访问该远程上游所使用的 outbound 名称。
    proxy: sg

  # upstream_mode: parallel | round-robin | load-balance | failover
  # 组成员改为对象，避免 name:weight 字符串的解析歧义。
  # round-robin 使用 smooth weighted round-robin；load-balance 使用 weight 归一化的 least-in-flight；
  # failover 严格按配置顺序，因此成员 weight 必须为 1。
  # parallel 会立即返回首个协议合法且问题匹配的 DNS 响应；NXDOMAIN、REFUSED、SERVFAIL 和 TC=1
  # 都是可返回的终态响应。若首响应不是完整 NOERROR/TC=0，其余已发出的主组请求继续到完成
  # 或 timeout，仅用于寻找可写缓存的 NOERROR/TC=0 响应；后台窗口结束后按成员配置顺序
  # 确定缓存候选。parallel 不使用权重，因此成员 weight 必须为 1。
  - name: inner-group
    type: group
    # 主上游成员及其权重。
    upstreams:
      # 成员上游名称。
      - name: aliyun
        # 权重必须为正整数。
        weight: 1
      - name: google
        weight: 1
    # 主组的成员选择模式。
    upstream_mode: parallel
    # 主组总超时时间。
    timeout: 3s
    # 只有主组在 timeout 内没有任何协议合法的 DNS 响应时才进入回退组。
    fallbacks:
      - name: tencent
        weight: 1
    # 回退成员选择模式。
    fallback_upstream_mode: parallel
    # 回退组总超时时间。
    fallback_timeout: 3s

  - name: outside-group
    type: group
    upstreams:
      - name: aliyun
        weight: 1
      - name: google
        weight: 1
    upstream_mode: failover
    timeout: 3s
    fallbacks:
      - name: tencent
        weight: 1
    fallback_upstream_mode: parallel
    fallback_timeout: 3s

# 策略列表；名称供 listener、client 和 DoH route 引用。
# 策略路由配置。
strategy:
  # 策略名称必须唯一。
  - name: default
    # 有序规则列表；从上到下匹配，命中第一条后停止。
    rules:
      # 规则集名称；必须与 rule_set 中的资源匹配。
      - rule_set: cn-site
        # 命中规则集后的上游名称。
        upstream: inner-group
      # 本地 hosts 资源名称；与 rule_set 二选一。
      - hosts: host1
      - rule_set: ai-!cn
        upstream: google
      - rule_set: steam
        upstream: cloudflare
        edns_client_subnet:
          mode: custom
          custom_ip: 120.85.11.0/24
      - rule_set: proxy-sites
        upstream: outside-group
      - hosts: host2
    # 策略级 ECS 覆盖；未配置字段继承下层设置。
    edns_client_subnet:
      mode: client
    # 未命中任何规则时使用的默认上游。
    default_upstream: inner-group

  - name: inner
    rules:
      - rule_set: geosite:cn
        upstream: inner-group
      - hosts: host1
    default_upstream: inner-group
    # enabled=true 时使用策略独立逻辑缓存池；不包含全局 memory/persistence。
    # 整个 cache 块缺失时才回退到全局池，enabled=false 会直接停止缓存。
    cache:
      # 是否在该策略启用缓存。
      enabled: true
      # 过期记录是否允许先返回并异步刷新。
      optimistic:
        enabled: true
        # 乐观缓存应答 TTL。
        answer_ttl: 10s
        # 过期记录可被乐观返回的最长时间。
        max_age: 1d
    # 策略级 TTL 覆写，与 cache 平级。
    ttl_override:
      # 是否在该策略启用 TTL 覆写。
      enabled: false
      # 最小 TTL；0s 表示不设置下限。
      min: 0s
      # 最大 TTL；0s 表示不设置上限。
      max: 0s

  - name: outside
    rules:
      - rule_set: ai-!cn
        upstream: google
      - rule_set: steam
        upstream: cloudflare
        edns_client_subnet:
          mode: custom
          custom_ip: 120.85.32.0/24
      - hosts: host1
    default_upstream: outside-group

# 本地 hosts 资源配置。
hosts:
  # 可被 listener 和 strategy 复用的本地 hosts 资源。
  # 每个 hosts 资源的 name 必须唯一。
  - name: host1
    # 资源来源类型；const 表示内联内容，file 表示本地文件。
    type: const
    # 内容格式；当前示例为 json 和 hosts。
    format: json
    # const 类型的内联 hosts 内容。
    hosts: |-
      {
        "*.aio.com": {
          "enable": true,
          "A": "192.168.1.1",
          "AAAA": ["fd00::1"]
        },
        "aliyun-dns": {
          "enable": false,
          "A": ["223.5.5.5", "223.6.6.6"]
        },
        "abc.com": {
          "enable": true,
          "CNAME": "c.abc.com"
        }
      }

  - name: host2
    type: const
    format: hosts
    hosts: |-
      192.168.1.1 *.aio.com
      223.5.5.5 aliyun-dns

  - name: host3
    type: file
    format: hosts
    # file 类型的 hosts 文件路径，相对于 work.path。
    path: ./rules/hosts.txt
    # file 类型的 auto_update 仅表示本地文件重载，不表示远程同步。
    # 是否自动重载本地文件。
    auto_update: true
    # 自动重载间隔。
    update_interval: 24h

# 代理出口配置。
outbound:
  # 远程上游和规则集使用的代理出口。
  # 每个出口的 name 必须唯一。
  - name: sg
    # 代理类型；当前示例为 SOCKS5 协议族。
    type: socks5
    # 代理连接地址；解析后的 URL 使用 socks5:// 表示本地解析，socks5h:// 表示由代理解析。
    # SecretRef 通过 env 或 file 提供实际凭据。
    proxy_url:
      # 从环境变量读取完整代理 URL。
      env: FLUXDNS_OUTBOUND_SG_URL

# 规则集资源配置。所有资源必须在监听器绑定前形成有效的首次快照，否则拒绝启动；
# 运行后的刷新按资源独立版本化，单个资源失败保留该资源上一份有效快照，不触发全局缓存清除。
rule_set:
  # 可被 strategy 引用的规则资源列表。
  # 每个规则集的 name 必须唯一。
  - name: cn-site
    # 规则资源来源类型；const 表示内联，file 表示本地文件，remote 表示远程下载。
    type: const
    # 规则内容格式。
    format: json
    # const 类型的内联规则内容。
    rule: |-
      {
        "domain": [
          "www.routerlogin.com",
          "tplogin.cn",
          "miwifi.com",
          "www.miwifi.com",
          "local.adguard.org"
        ],
        "domain_suffix": [
          "internal",
          "localdomain",
          "example",
          "invalid",
          "localhost",
          "test",
          "local",
          "lan",
          "127.in-addr.arpa",
          "10.in-addr.arpa"
        ],
        "domain_regex": "^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$"
      }

  - name: ai-!cn
    type: const
    # Clash 行格式不是标准 YAML，使用专用格式名避免误导。
    format: clash
    rule: |-
      DOMAIN-SUFFIX,openai.com
      DOMAIN-SUFFIX,ai.com
      DOMAIN-SUFFIX,invoice.stripe.com
      DOMAIN-SUFFIX,stripe.com
      DOMAIN,bard.google.com
      DOMAIN-SUFFIX,bing.com

  - name: steam
    type: file
    format: clash
    # file 类型的规则文件路径，相对于 work.path。
    path: ./rules/steam.txt
    # 是否自动重载本地规则文件。
    auto_update: true
    # 自动重载间隔。
    update_interval: 24h

  - name: proxy-sites
    type: remote
    format: json
    # raw 文件地址；当前 schema 不提供 expected checksum 字段，生产环境应固定 URL/revision 并在部署层校验内容。
    # 远程规则下载地址。
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/cn.json
    # 下载远程规则时使用的 outbound 名称。
    proxy: sg
    # 是否自动刷新远程规则。
    auto_update: true
    # 远程规则刷新间隔。
    update_interval: 24h

  - name: geosite
    type: remote
    format: dat
    # 远程规则下载地址。
    url: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
    # 下载远程规则时使用的 outbound 名称。
    proxy: sg
    # 是否自动刷新远程规则。
    auto_update: true
    # 远程规则刷新间隔。
    update_interval: 24h

# 客户端匹配配置。
clients:
  # 客户端匹配和客户端级覆盖列表。
  # ids 为精确匹配，ips 为 CIDR 匹配；两者同时命中时先比较 id，再比较最长前缀。
  # 同优先级冲突应在配置校验阶段报错，而不是依赖数组顺序。
  # 每个客户端规则的 name 必须唯一。
  - name: client1
    # 客户端匹配条件。
    match:
      # DoH client_id 或其他协议提供的客户端标识。
      ids:
        - 7a753d8a-a5c7-4e37-a207-9b0e15d9009f
      # 客户端 IP/CIDR 匹配条件。
      ips:
        - 192.168.1.0/24
        - fe80::/10
    # 客户端命中的策略；省略时继承 listener/route 的策略。
    strategy: inner
    # enabled=true 时使用“实际客户端身份 + 生效策略”的独立逻辑缓存池。
    # 整个 cache 块缺失时才继续选择策略池/全局池，enabled=false 会直接停止缓存。
    cache:
      # 是否在该客户端启用缓存。
      enabled: true
      # 过期记录是否允许先返回并异步刷新。
      optimistic:
        enabled: true
        # 乐观缓存应答 TTL。
        answer_ttl: 10s
        # 过期记录可被乐观返回的最长时间。
        max_age: 1d
    # 客户端级 TTL 覆写，与 cache 平级。
    ttl_override:
      # 是否在该客户端启用 TTL 覆写。
      enabled: false
      # 最小 TTL；0s 表示不设置下限。
      min: 0s
      # 最大 TTL；0s 表示不设置上限。
      max: 0s
    # 客户端级 ECS 覆盖。
    edns_client_subnet:
      # ECS 处理模式。
      mode: custom
      # mode=custom 时使用的 ECS 网段。
      custom_ip: 120.85.32.0/24

# v1 启动前必须执行的校验：
# - work.path 非空；相对值以启动配置文件目录解析，目录不存在时创建，启动配置不在该目录时复制为 config.yaml；
# - 拒绝未知字段；每种 type 只允许自己的字段集合；
# - 所有 name 唯一，且所有引用存在、类型正确；
# - webui 配置保留但 enable 必须为 false；v1 不实例化 WebUI，也不把它加入 bind 计划；
# - 所有 listener endpoint 展开后不得存在 TCP/UDP bind 冲突；
# - mode、format、type、端口、CIDR、URL、duration 和内嵌内容必须合法；
# - ttl_override 与 cache 为平级配置，不得嵌套在 cache 内；未配置的 override 块按字段继承；
# - 未配置的 edns_client_subnet 块继承下层，显式 disabled 才停止继承；
# - webui.users[].password_hash 必须是受支持算法生成的单向 hash，禁止明文 password 字段；
# - 同一个 doh listener 可以拥有多个 endpoint；每个 endpoint 的 tls.mode 独立校验，
#   terminate 必须有证书和私钥，external 不得配置证书字段；
# - DoH 固定支持 GET/POST、application/dns-message 和 65535 字节 DNS wire 上限；
# - endpoint.client_ip.source=forwarded_header/proxy_protocol 必须配置 trusted_proxies，
#   且只信任代理对端地址；
#   forwarded header 链按从右到左解析，反向代理必须先清理客户端自带的伪造 header；
# - bootstrap 与 connect_ip 互斥；socks5h:// 不得再配置 bootstrap；
# - database.type/path 始终必填，聚合统计默认开启并依赖 SQLite；
# - resolve_log 只控制每次解析详情，关闭时仍保留按日/客户端等聚合统计；
# - 0 < resolve_log.eviction_threshold_records < resolve_log.max_records；
# - 任何引用环、资源首次加载失败或内容校验失败都提供带路径的错误并阻止启动。
